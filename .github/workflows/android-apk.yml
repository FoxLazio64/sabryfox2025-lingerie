name: SabryFox2025 - APK Android firmato

on:
  push:
    branches:
      - tablet-sync-20261117
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sabryfox2025-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compila APK SabryFox2025 Lingerie
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v7

      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm


      - name: Configura Android SDK
        uses: android-actions/setup-android@v4

      - name: Installa strumenti Android SDK 37.0
        run: |
          sdkmanager --install --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - name: Installa dipendenze
        run: npm ci

      - name: Verifica progetto Expo
        run: npx expo-doctor

      - name: Genera progetto Android
        run: npx expo prebuild --platform android --no-install

      - name: Configura Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      - name: Prepara firma originale
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$ANDROID_KEYSTORE_PATH"

          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let source = fs.readFileSync(file, 'utf8');

          const marker = '    signingConfigs {';
          if (source.split(marker).length !== 2) {
            throw new Error('Blocco signingConfigs non riconosciuto.');
          }

          source = source.replace(marker, `${marker}
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }`);

          const buildTypes = source.indexOf('buildTypes {');
          const release = source.indexOf('release {', buildTypes);
          const end = source.indexOf('\n        }\n    }', release);
          const oldSigning = source.indexOf(
            'signingConfig signingConfigs.debug',
            release
          );

          if (buildTypes < 0 || release < 0 ||
              end < 0 || oldSigning < release || oldSigning > end) {
            throw new Error('Blocco release non riconosciuto.');
          }

          source = source.slice(0, oldSigning) +
            'signingConfig signingConfigs.release' +
            source.slice(oldSigning + 'signingConfig signingConfigs.debug'.length);

          fs.writeFileSync(file, source);
          console.log('Firma Release configurata.');
          NODE

      - name: Compila APK Release firmato
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verifica firma APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Salva APK per il download
        uses: actions/upload-artifact@v7
        with:
          name: SabryFox2025-Lingerie-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
